name: WordPress.org SVN

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the approved version to WordPress.org SVN
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wordpress-org-svn
  cancel-in-progress: false

jobs:
  svn:
    if: github.repository == 'Imazeohq/imazeo-wordpress' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wordpress-org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and stage the approved tag
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/package.py --tag "$GITHUB_REF_NAME"
      - name: Deploy the staged plugin to SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ inputs.publish != true }}
        env:
          SLUG: imazeo
          BUILD_DIR: build/imazeo
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
